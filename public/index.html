<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Live — Text + Voice Chatbot</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">✦</span>
      <div class="brand-text">
        <h1>Gemini Live</h1>
        <span class="model-tag" id="modelTag">gemini-3.8-live-extended-thinking</span>
      </div>
    </div>

    <div class="controls">
      <span class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">Connecting…</span></span>

      <label class="control">
        <span>Model</span>
        <select id="modelSelect" title="Gemini Live model (restarts the session)">
          <option value="gemini-3.8-live-extended-thinking" selected>Extended thinking</option>
          <option value="gemini-3.8-live">3.8 Live (fast)</option>
        </select>
      </label>

      <label class="control">
        <span>Voice</span>
        <select id="voiceSelect" title="Voice — “Default” uses the model’s built-in voice (safest); custom voices restart the session">
          <option value="" selected>Default</option>
          <option value="Puck">Puck</option>
          <option value="Kore">Kore</option>
          <option value="Charon">Charon</option>
          <option value="Fenrir">Fenrir</option>
          <option value="Leda">Leda</option>
          <option value="Orus">Orus</option>
          <option value="Zephyr">Zephyr</option>
          <option value="Aoede">Aoede</option>
          <option value="Callirrhoe">Callirrhoe</option>
          <option value="Autonoe">Autonoe</option>
          <option value="Enceladus">Enceladus</option>
          <option value="Iapetus">Iapetus</option>
          <option value="Algenib">Algenib</option>
          <option value="Rasalgethi">Rasalgethi</option>
          <option value="Alnilam">Alnilam</option>
          <option value="Schedar">Schedar</option>
        </select>
      </label>

      <label class="control">
        <span>Thinking</span>
        <select id="thinkingSelect" title="Extended-thinking depth (restarts the session)">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </label>

      <button id="newChatBtn" class="ghost-btn" title="Start a fresh conversation">New chat</button>
    </div>
  </header>

  <main id="chat">
    <div id="messages"></div>

    <div id="suggestions" class="suggestions">
      <button class="chip" data-q="Tell me a short joke.">😄 Tell me a short joke</button>
      <button class="chip" data-q="Explain quantum computing in three simple sentences.">🔬 Explain quantum computing</button>
      <button class="chip" data-q="Write a haiku about the sea.">🌊 Write a haiku about the sea</button>
    </div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message Gemini… (Enter to send, Shift+Enter for a new line)" autocomplete="off"></textarea>
      <button id="sendBtn" class="send-btn" title="Send" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
    <p class="hint">Gemini answers with spoken voice + live text. Sessions last up to 15&nbsp;minutes — use “New chat” for a fresh context.</p>

    <details id="diagBox">
      <summary>🔍 Diagnostics <span id="diagVersion" class="diag-version"></span></summary>
      <div id="diagList"></div>
    </details>
  </footer>

  <div id="toasts"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
